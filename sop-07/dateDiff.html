<!DOCTYPE html>
<html>

<head>
    <title>Date Difference</title>
</head>

<body>

    <h2>Date Difference in Days</h2>

    Enter First Date (dd-mm-yyyy):
    <input type="text" id="date1" placeholder="04-02-2019"><br><br>

    Enter Second Date (dd-mm-yyyy):
    <input type="text" id="date2" placeholder="11-04-2019"><br><br>

    <button onclick="calculateDiff()">Get Difference</button>

    <h3 id="result"></h3>

    <script>
        function calculateDiff() {
            var d1_str = document.getElementById("date1").value;
            var d2_str = document.getElementById("date2").value;

            var result = date_diff_indays(d1_str, d2_str);
            document.getElementById("result").innerHTML = "Difference: " + result + " days";
        }

        function date_diff_indays(date1, date2) {
            var parts1 = date1.split('-');
            var parts2 = date2.split('-');

            var dt1 = new Date(parts1[2], parts1[1] - 1, parts1[0]);
            var dt2 = new Date(parts2[2], parts2[1] - 1, parts2[0]);

            var timeDiff = dt2.getTime() - dt1.getTime();

            var dayDiff = timeDiff / (1000 * 60 * 60 * 24);

            return Math.floor(dayDiff);
        }
    </script>

</body>

</html>
