<!DOCTYPE html>
<html>
<head>
<title>Count Vowels</title>
</head>
<body>
<script type="text/javascript">
    
function getVowels() {
var vowelsCount = 0;
var str = document.getElementById("t1").value;
var string = str.toString();
for (var i = 0; i <= string.length - 1; i++) {
if (string.charAt(i) == "a" || string.charAt(i) == "e" || string.charAt(i) ==
"i" || string.charAt(i) == "o" || string.charAt(i) == "u" || string.charAt(i) == "A" || string.charAt(i) == "E" || string.charAt(i) ==
"I" || string.charAt(i) == "O" || string.charAt(i) == "U") {
vowelsCount += 1;
}
}

document.getElementById('show').innerHTML = "Total Vowels:- "+vowelsCount;
return vowelsCount;
}
</script>

<input type="text" id="t1">
<input type="submit" value="Check Vowels" onclick="getVowels()">

<p id="show"> </p>
</body>
</html>
